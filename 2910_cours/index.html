<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>La fabrique de mots et de phrases</title>
<style>
:root{
  --ink:#24334a;--muted:#68758a;--paper:#fffdf8;--bg:#f3f0e8;
  --coral:#f4a18e;--yellow:#f5d778;--blue:#a9c9df;--green:#b8d7bd;
  --lilac:#c9b9e5;--line:#dcd9d0;--white:#fff;--good:#3e7654;--bad:#9a5a4f;
  --shadow:0 8px 26px rgba(45,54,70,.08);--radius:22px;
}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{margin:0;color:var(--ink);font-family:"Nunito","Trebuchet MS",system-ui,-apple-system,sans-serif;background:var(--bg);font-size:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid #557fa8;outline-offset:3px}
button:disabled{opacity:.45;cursor:not-allowed}
.app{max-width:1180px;min-height:100vh;margin:0 auto;padding:20px clamp(12px,3vw,32px) 28px;display:flex;flex-direction:column;gap:18px}
.topbar{display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:11px;font-weight:900;letter-spacing:-.03em;font-size:clamp(17px,2vw,22px)}
.brand-mark{width:43px;height:43px;border-radius:14px;background:var(--yellow);display:grid;place-items:center;border:2px solid var(--ink);transform:rotate(-4deg);font-size:22px}
.top-actions{display:flex;gap:8px;align-items:center}
.ghost,.navbtn,.primary,.softbtn,.choice,.tile,.word-letter,.slot,.mode-card,.room-card{border:2px solid var(--ink);border-radius:15px;transition:transform .12s,box-shadow .12s,background .12s}
.ghost,.navbtn,.softbtn{background:var(--paper);padding:10px 14px;font-weight:800}
.ghost:hover,.navbtn:hover,.softbtn:hover,.choice:hover,.tile:hover,.mode-card:hover{transform:translateY(-2px);box-shadow:0 4px 0 rgba(36,51,74,.12)}
.progress-wrap{display:flex;align-items:center;gap:12px}
.progress-track{height:8px;flex:1;background:#e3dfd5;border-radius:99px;overflow:hidden}
.progress-fill{height:100%;width:0;background:var(--green);border-radius:99px;transition:width .25s}
.progress-label{font-size:12px;color:var(--muted);font-weight:900;white-space:nowrap}
.main{flex:1;display:flex;flex-direction:column;gap:16px}
.panel{background:var(--paper);border:2px solid var(--ink);border-radius:var(--radius);box-shadow:var(--shadow);padding:clamp(18px,3vw,34px);position:relative;overflow:hidden}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.13em;font-weight:1000;color:var(--muted);margin-bottom:9px}
h1,h2,h3,p{margin-top:0}
h1,h2,h3{font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;letter-spacing:-.035em}
h1{font-size:clamp(32px,5vw,58px);line-height:1.03;margin-bottom:14px}
h2{font-size:clamp(26px,3.7vw,40px);line-height:1.08;margin-bottom:12px}
h3{font-size:21px;margin-bottom:8px}
p{line-height:1.5}
.lead{font-size:clamp(16px,2vw,19px);color:var(--muted);max-width:650px}
.hero{display:grid;grid-template-columns:1.15fr .85fr;align-items:center;gap:20px;min-height:330px}
.hero-art{min-height:230px;display:grid;place-items:center;position:relative}
.hero-note{position:absolute;right:5%;top:7%;background:var(--yellow);border:2px solid var(--ink);border-radius:14px;padding:10px 14px;font-weight:900;transform:rotate(5deg)}
.paper-stack{width:min(300px,90%);height:235px;position:relative}
.paper-stack .sheet{position:absolute;width:72%;height:80%;border:2px solid var(--ink);border-radius:18px;background:var(--blue);left:7%;top:8%;transform:rotate(-8deg)}
.paper-stack .sheet:nth-child(2){background:var(--coral);left:17%;top:5%;transform:rotate(6deg)}
.paper-stack .sheet:nth-child(3){background:#f9e9bb;left:12%;top:15%;transform:rotate(-2deg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px}
.pencil{width:72%;height:14px;border:2px solid var(--ink);border-radius:5px;background:var(--green);transform:rotate(-35deg);position:absolute;bottom:25%;right:-1%}
.pencil:after{content:"";position:absolute;right:-11px;top:-2px;border-left:11px solid var(--ink);border-top:7px solid transparent;border-bottom:7px solid transparent}
.scribble{font-size:28px;font-weight:1000;letter-spacing:.04em}
.mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.mode-card{padding:20px;text-align:left;background:var(--white);min-height:180px;display:flex;flex-direction:column;gap:10px}
.mode-card:nth-child(1){background:#fff0e9}.mode-card:nth-child(2){background:#f9f1ce}.mode-card:nth-child(3){background:#eaf3ed}
.mode-number{font-size:12px;font-weight:1000;letter-spacing:.12em;color:var(--muted)}
.mode-icon{font-size:32px;line-height:1}
.mode-card strong{font-size:20px}
.mode-card small{font-size:14px;line-height:1.45;color:var(--muted)}
.primary{background:var(--ink);color:white;padding:13px 20px;font-weight:900;border-color:var(--ink)}
.primary:hover{background:#344a67;transform:translateY(-1px)}
.softbtn{background:#f7e8b4}
.footer-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.navgroup{display:flex;gap:8px;flex-wrap:wrap}
.instruction{font-size:17px;color:var(--muted);margin-bottom:18px}
.task-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}
.task-counter{white-space:nowrap;background:#f2eee3;border:1px solid var(--line);border-radius:99px;padding:7px 11px;font-size:12px;font-weight:900}
.task-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,.85fr);gap:22px;align-items:stretch}
.prompt-card{background:#f5f1e7;border-radius:18px;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:245px;text-align:center}
.prompt-word{font-size:clamp(28px,4vw,43px);font-weight:1000;line-height:1.15;overflow-wrap:anywhere}
.prompt-translation{font-size:clamp(25px,3.5vw,38px);font-weight:1000;line-height:1.2}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-content:center}
.choice{background:white;padding:18px 12px;min-height:88px;font-size:clamp(19px,2.6vw,26px);font-weight:900;display:flex;align-items:center;justify-content:center;text-align:center;overflow-wrap:anywhere}
.choice.correct{background:#d9eadb;border-color:var(--good)}
.choice.incorrect{background:#f8dfd6;border-color:var(--bad)}
.feedback{margin-top:14px;border-radius:14px;padding:12px 15px;background:#f3eee2;font-weight:800;min-height:46px}
.feedback.good{background:#e2f0e2;color:#315e40}.feedback.try{background:#f9e6dd;color:#804a40}
.feedback:empty{display:none}
.hintbox{background:#eaf2f7;border:1px dashed #7798ae;border-radius:14px;padding:13px 15px;margin-top:12px;line-height:1.45}
.hidden{display:none!important}
.visual-stage{min-height:240px;display:grid;place-items:center;background:#f5f1e7;border-radius:18px;padding:16px}
.object-art{width:min(100%,250px);height:190px;display:block}.supplied-art{object-fit:contain;border-radius:12px;mix-blend-mode:multiply}
.illustration-caption{font-size:13px;color:var(--muted);margin-top:6px}
.letter-bank{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:16px 0}
.word-letter{background:#fff;border-radius:12px;min-width:54px;height:58px;font-size:26px;font-weight:1000}
.word-letter.used{opacity:.35;transform:none}
.slots{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:18px 0}
.slot{width:54px;height:62px;background:#fff;border-style:dashed;display:grid;place-items:center;font-size:27px;font-weight:1000}
.slot.filled{background:#eaf3ed;border-style:solid}
.letter-controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.word-image-wrap{display:flex;justify-content:center;gap:16px;align-items:center;flex-wrap:wrap}
.article-pairs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:20px 0}
.article-example{border:2px solid var(--ink);border-radius:15px;background:#fff;padding:17px;text-align:center;font-size:clamp(21px,3vw,30px);font-weight:1000}
.article-example .article{display:inline-block;border-radius:8px;padding:3px 8px;margin-right:5px}
.article-un{background:#dbeaf5}.article-une{background:#f9dfd5}
.article-question{text-align:center;background:#f5f1e7;border-radius:18px;padding:25px 12px;margin-bottom:15px}
.article-question .noun{font-size:clamp(30px,5vw,46px);font-weight:1000}
.article-buttons{display:flex;justify-content:center;gap:16px}
.article-buttons .choice{width:min(200px,45%);min-height:90px;font-size:32px}
.phrase-area{display:flex;flex-direction:column;gap:18px}
.phrase-scene{background:#f5f1e7;border-radius:18px;padding:20px;display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}
.phrase-blocks{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.phrase-block{border:2px solid var(--ink);border-radius:12px;padding:13px 17px;font-size:clamp(18px,2.5vw,25px);font-weight:1000}
.phrase-block.room{background:#dcebf5}.phrase-block.structure{background:#f9e7b3}.phrase-block.object{background:#dcebdd}
.phrase-bank{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;min-height:70px;padding:12px;background:#f5f1e7;border-radius:16px}
.tile{background:white;padding:12px 15px;font-weight:900;font-size:clamp(16px,2vw,21px);border-radius:13px}
.tile.room{background:#dcebf5}.tile.structure{background:#f9e7b3}.tile.object{background:#dcebdd}
.tile.selected{outline:3px solid #6d8aa4;outline-offset:2px}
.sentence-result{text-align:center;font-size:clamp(22px,3vw,32px);font-weight:1000;padding:18px;background:#e8f1e7;border-radius:16px}
.room-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.room-card{padding:16px;background:white;text-align:center;font-weight:900;min-height:86px}
.room-card small{display:block;color:var(--muted);font-weight:700;margin-top:5px}
.end-panel{text-align:center;padding:clamp(28px,6vw,64px)}
.end-star{font-size:62px;margin-bottom:8px}
.end-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:24px}
.scene{width:min(100%,570px);height:auto;display:block}
.scene-wrap{background:#fff7e5;border:2px solid var(--ink);border-radius:18px;padding:10px}
.scene-item{cursor:pointer}
.scene-item:focus{outline:3px solid #557fa8}
.chase-controls{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:14px}
kbd{font-family:inherit;font-size:12px;background:#fff;border:1px solid var(--line);border-radius:5px;padding:2px 5px}
.note{font-size:12px;color:var(--muted);line-height:1.45}
@media(max-width:760px){
 .hero{grid-template-columns:1fr;min-height:auto}.hero-art{min-height:180px}.paper-stack{height:175px;width:240px}
 .mode-grid{grid-template-columns:1fr}.mode-card{min-height:130px}
 .task-layout{grid-template-columns:1fr}.choices{grid-template-columns:repeat(2,minmax(0,1fr))}
 .room-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .task-head{flex-direction:column}.topbar{align-items:flex-start}.brand{font-size:16px}.brand-mark{width:36px;height:36px}
}
@media(max-width:430px){
 .app{padding:12px 10px 20px}.panel{padding:17px}.choices{grid-template-columns:1fr}.choice{min-height:65px}
 .article-pairs{grid-template-columns:1fr}.top-actions .ghost{padding:8px}.prompt-card{min-height:190px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand"><div class="brand-mark" aria-hidden="true">✎</div><span>La fabrique de mots<br><span style="font-weight:600;color:var(--muted);font-size:.78em">et de phrases</span></span></div>
    <div class="top-actions">
      <button class="ghost" id="homeBtn" type="button" title="Вернуться в меню">⌂ Меню</button>
      <button class="ghost" id="restartBtn" type="button" title="Начать текущий режим заново">↻ Сначала</button>
    </div>
  </header>
  <div class="progress-wrap" aria-label="Прогресс занятия">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">ON EXPLORE À SON RYTHME</div>
  </div>
  <main class="main" id="main"></main>
  <footer class="footer-nav">
    <div class="navgroup"><button class="navbtn" id="backBtn" type="button">← Назад</button><button class="navbtn" id="skipBtn" type="button">Пропустить →</button></div>
    <div class="navgroup"><button class="softbtn" id="hintBtn" type="button">💡 Подсказка</button><button class="primary" id="nextBtn" type="button">Дальше →</button></div>
  </footer>
  <div class="note">Игра для управления преподавателем. Ответы ученицы принимаются устно; приложение не распознаёт речь и не оценивает произношение.</div>
</div>
<script>
"use strict";

/* СЛОВАРЬ: редактируйте этот объект, чтобы менять содержание игры. */
const DATA = {
  rooms: [
    {id:"chambre",fr:"la chambre",translation:"спальня",familiar:true,practice:true},
    {id:"cuisine",fr:"la cuisine",translation:"кухня",familiar:true,practice:true},
    {id:"salon",fr:"le salon",translation:"гостиная",familiar:true,practice:true},
    {id:"bains",fr:"la salle de bains",translation:"ванная комната",familiar:true,practice:true},
    {id:"jardin",fr:"le jardin",translation:"сад",familiar:true,practice:true},
    {id:"manger",fr:"la salle à manger",translation:"столовая",familiar:false,practice:false},
    {id:"entree",fr:"l’entrée",translation:"прихожая",familiar:false,practice:false},
    {id:"garage",fr:"le garage",translation:"гараж",familiar:false,practice:false},
    {id:"toilettes",fr:"les toilettes",translation:"туалет",familiar:false,practice:false}
  ],
  objects: [
    {id:"lit",fr:"un lit",noun:"lit",article:"un",translation:"кровать",category:"основная",familiar:true,image:"inline:lit",modes:["match","translation","letters","article","phrase"],rooms:["chambre"]},
    {id:"table",fr:"une table",noun:"table",article:"une",translation:"стол",category:"основная",familiar:true,image:"inline:table",modes:["match","translation","letters","article","phrase"],rooms:["cuisine","salleManger"]},
    {id:"chaise",fr:"une chaise",noun:"chaise",article:"une",translation:"стул",category:"основная",familiar:true,image:"inline:chaise",modes:["match","translation","letters","article","phrase"],rooms:["cuisine","salon"]},
    {id:"canape",fr:"un canapé",noun:"canapé",article:"un",translation:"диван",category:"основная",familiar:true,image:"inline:canape",modes:["match","translation","letters","article","phrase"],rooms:["salon"]},
    {id:"porte",fr:"une porte",noun:"porte",article:"une",translation:"дверь",category:"основная",familiar:true,image:"inline:porte",modes:["match","translation","letters","article","phrase"],rooms:["chambre","salon","cuisine"]},
    {id:"fenetre",fr:"une fenêtre",noun:"fenêtre",article:"une",translation:"окно",category:"основная",familiar:true,image:"inline:fenetre",modes:["match","translation","letters","article","phrase"],rooms:["chambre","salon"]},
    {id:"frigo",fr:"un réfrigérateur",noun:"réfrigérateur",article:"un",translation:"холодильник",category:"дополнительная",familiar:true,image:"inline:frigo",modes:["match","translation","letters","article"],rooms:["cuisine"]},
    {id:"cuisiniere",fr:"une cuisinière",noun:"cuisinière",article:"une",translation:"плита",category:"дополнительная",familiar:true,image:"inline:cuisiniere",modes:["match","translation","letters","article"],rooms:["cuisine"]},
    {id:"baignoire",fr:"une baignoire",noun:"baignoire",article:"une",translation:"ванна",category:"дополнительная",familiar:true,image:"inline:baignoire",modes:["match","translation","letters","article"],rooms:["bains"]},
    {id:"bureau",fr:"un bureau",noun:"bureau",article:"un",translation:"письменный стол",category:"дополнительная",familiar:true,image:"inline:bureau",modes:["match","translation","letters","article"],rooms:["chambre"]},
    {id:"fauteuil",fr:"un fauteuil",noun:"fauteuil",article:"un",translation:"кресло",category:"дополнительная",familiar:true,image:"inline:fauteuil",modes:["match","translation","letters","article"],rooms:["salon"]},
    {id:"lampadaire",fr:"un lampadaire",noun:"lampadaire",article:"un",translation:"торшер",category:"дополнительная",familiar:true,image:"inline:lampadaire",modes:["match","translation","letters","article"],rooms:["salon"]}
  ],
  phrases: [
    {id:"p1",room:"la chambre",roomId:"chambre",object:"lit",sentence:"Dans la chambre, il y a un lit."},
    {id:"p2",room:"la chambre",roomId:"chambre",object:"fenetre",sentence:"Dans la chambre, il y a une fenêtre."},
    {id:"p3",room:"le salon",roomId:"salon",object:"canape",sentence:"Dans le salon, il y a un canapé."},
    {id:"p4",room:"la cuisine",roomId:"cuisine",object:"table",sentence:"Dans la cuisine, il y a une table."},
    {id:"p5",room:"la cuisine",roomId:"cuisine",object:"chaise",sentence:"Dans la cuisine, il y a une chaise."},
    {id:"p6",room:"le salon",roomId:"salon",object:"fauteuil",sentence:"Dans le salon, il y a un fauteuil."}
  ]
};

const $ = (sel,root=document)=>root.querySelector(sel);
const $$ = (sel,root=document)=>[...root.querySelectorAll(sel)];
const main=$("#main");
const state={screen:"home",mode:null,index:0,taskList:[],history:[],revealed:false,hint:false,selected:[],letterSlots:[],usedExtra:false,feedback:"",feedbackType:"",phraseOrder:[],phraseBank:[],activePhrase:null,articleStep:0,chaseFound:[],modeIndex:0};
const modeNames={words:"La fabrique de mots",articles:"Un ou une ?",phrases:"La fabrique de phrases",chase:"La chasse aux objets"};
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function objectById(id){return DATA.objects.find(o=>o.id===id);}
function roomById(id){return DATA.rooms.find(o=>o.id===id);}
function current(){return state.taskList[state.index];}
function setProgress(){
 const total=state.taskList.length||1;
 const pct=state.screen==="home"?0:state.screen==="end"?100:Math.round(((state.index+1)/total)*100);
 $("#progressFill").style.width=pct+"%";
 $("#progressLabel").textContent=state.screen==="home"?"ON EXPLORE À SON RYTHME":state.screen==="end"?"BRAVO, ON A EXPLORÉ !":`ÉTAPE ${Math.min(state.index+1,total)} / ${total}`;
 $("#backBtn").disabled=state.screen==="home"||state.screen==="end"||state.index===0;
 $("#skipBtn").classList.toggle("hidden",state.screen==="home"||state.screen==="end");
 $("#hintBtn").classList.toggle("hidden",state.screen==="home"||state.screen==="end");
 $("#nextBtn").classList.toggle("hidden",state.screen==="home"||state.screen==="end");
 $("#restartBtn").classList.toggle("hidden",state.screen==="home");
}
function home(){
 state.screen="home";state.mode=null;state.index=0;state.taskList=[];state.history=[];state.hint=false;state.revealed=false;
 main.innerHTML=`
 <section class="panel hero">
  <div><div class="eyebrow">ATELIER DE FRANÇAIS · À TON RYTHME</div>
  <h1>La fabrique<br>de mots<br>et de phrases</h1>
  <p class="lead">On observe, on cherche, on assemble. Et si on hésite, on essaie ensemble !</p>
  <button class="primary" id="startWords">Commencer l’atelier →</button>
  </div>
  <div class="hero-art" aria-hidden="true"><div class="paper-stack"><div class="sheet"></div><div class="sheet"></div><div class="sheet"><div class="scribble">mot</div><div style="font-size:28px">＋ phrase</div></div><div class="pencil"></div></div><div class="hero-note">On y va !</div></div>
 </section>
 <section class="mode-grid">
  <button class="mode-card" data-start="words"><span class="mode-number">01 · 8–10 MIN</span><span class="mode-icon">✎</span><strong>La fabrique de mots</strong><small>Reconnaître, retrouver et reconstruire des mots français.</small></button>
  <button class="mode-card" data-start="articles"><span class="mode-number">02 · 4–5 MIN</span><span class="mode-icon">un / une</span><strong>Un ou une ?</strong><small>Observer les mots et essayer les deux articles.</small></button>
  <button class="mode-card" data-start="phrases"><span class="mode-number">03 · 10–12 MIN</span><span class="mode-icon">▰ ▰ ▰</span><strong>La fabrique de phrases</strong><small>Assembler une phrase avec des blocs familiers.</small></button>
 </section>
 <section class="panel" style="padding:18px 22px"><div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between"><div><strong>Bonus : La chasse aux objets</strong><div class="note">Une petite scène pour chercher les objets à l’oral.</div></div><button class="softbtn" data-start="chase">Explorer la scène →</button></div></section>`;
 $$("[data-start]",main).forEach(b=>b.addEventListener("click",()=>startMode(b.dataset.start)));
 $("#startWords").addEventListener("click",()=>startMode("words"));
 setProgress();footerHome();
}
function footerHome(){ $("#backBtn").classList.add("hidden");$("#skipBtn").classList.add("hidden");$("#hintBtn").classList.add("hidden");$("#nextBtn").classList.add("hidden"); }
function buildWordTasks(){
 const familiar=DATA.objects.filter(o=>o.familiar&&o.category==="основная");
 const tasks=[];
 // Узнавание: слово дано, картинка без подписи.
 shuffle(familiar).slice(0,4).forEach(o=>tasks.push({type:"match",id:o.id}));
 // Перевод: текстовые варианты, без изображения.
 shuffle(familiar).slice(0,4).forEach(o=>tasks.push({type:"translation",id:o.id}));
 // Сборка букв для коротких слов, чтобы не перегружать первый проход.
 ["lit","table","porte","canape"].forEach(id=>tasks.push({type:"letters",id}));
 // Акцентный пример: слово знакомится с образцом и проверяется по буквенным блокам.
 tasks.push({type:"letters",id:"fenetre",accent:true});
 return tasks;
}
function startMode(mode){
 state.mode=mode;state.index=0;state.history=[];state.hint=false;state.revealed=false;state.feedback="";state.selected=[];state.usedExtra=false;
 if(mode==="words"){state.taskList=buildWordTasks();state.screen="game";}
 else if(mode==="articles"){state.taskList=shuffle(DATA.objects.filter(o=>o.category==="основная")).slice(0,6).map(o=>({type:"article",id:o.id}));state.screen="game";}
 else if(mode==="phrases"){state.taskList=shuffle(DATA.phrases.slice(0,6)).map(p=>({type:"phrase",id:p.id}));state.screen="game";}
 else if(mode==="chase"){state.taskList=[{type:"chase"}];state.screen="game";}
 render();
}

function promptPanel(label,title,sub=""){
 return `<div class="task-head"><div><div class="eyebrow">${esc(label)}</div><h2>${title}</h2>${sub?`<p class="instruction">${sub}</p>`:""}</div><div class="task-counter">${state.index+1} / ${state.taskList.length}</div></div>`;

function render(){
 if(state.screen==="home"){home();return;}
 if(state.screen==="end"){endScreen();return;}
 setProgress();
 const task=current();
 if(!task){state.screen="end";endScreen();return;}
 state.hint=false;state.revealed=false;state.feedback="";state.feedbackType="";state.selected=[];state.phraseOrder=[];state.phraseBank=[];
 let html="";
 if(task.type==="roomChoice") html=renderRoomChoice(task);
 else if(task.type==="roomIntro") html=renderRoomIntro(task);
 else if(task.type==="match") html=renderMatch(task);
 else if(task.type==="translation") html=renderTranslation(task);
 else if(task.type==="letters") html=renderLetters(task);
 else if(task.type==="article") html=renderArticle(task);
 else if(task.type==="phrase") html=renderPhrase(task);
 else if(task.type==="chase") html=renderChase();
 main.innerHTML=html;
 bindTask(task);
 $("#hintBtn").textContent="💡 Подсказка";
 $("#nextBtn").textContent=state.index===state.taskList.length-1?"Завершить этап ✓":"Дальше →";
 setProgress();
}

function renderRoomChoice(task){
 const r=roomById(task.id);
 const opts=shuffle([r,...shuffle(DATA.rooms.filter(x=>x.id!==r.id&&x.familiar)).slice(0,2)]);
 return `<section class="panel">${promptPanel("LA FABRIQUE DE MOTS · A","Retrouve la pièce","Прочитай французское название и выбери его значение. Новые комнаты пока не проверяем без подсказки.")}<div class="task-layout"><div class="prompt-card"><div class="eyebrow">LA PIÈCE</div><div class="prompt-word">${esc(r.fr)}</div><p class="illustration-caption">Произнеси название вслух.</p></div><div class="choices">${opts.map(x=>`<button class="choice" data-room-answer="${x.id}">${esc(x.translation)}</button>`).join("")}</div></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="hintbox hidden" id="hintbox">Подсказка: вспомни, какие предметы обычно бывают в этой комнате.</div></section>`;
}
function renderRoomIntro(task){
 const r=roomById(task.id);
 return `<section class="panel">${promptPanel("NOUVEAUX MOTS · DÉCOUVERTE","Découvrons une nouvelle pièce","Это новые слова. Ничего не нужно вспоминать по памяти — просто посмотри, послушай и повтори.")}<div class="prompt-card" style="min-height:250px"><div class="eyebrow">UNE NOUVELLE PIÈCE</div><div class="prompt-word">${esc(r.fr)}</div><div class="prompt-translation" style="margin-top:14px">${esc(r.translation)}</div><p class="illustration-caption">Преподаватель произносит слово, ученица повторяет.</p></div><div class="feedback" id="feedback" aria-live="polite">On découvre tranquillement !</div></section>`;
}
function renderMatch(task){
 const o=objectById(task.id);
 const distractors=shuffle(DATA.objects.filter(x=>x.id!==o.id&&x.category==="основная")).slice(0,2);
 const opts=shuffle([o,...distractors]);
 return `<section class="panel">${promptPanel("LA FABRIQUE DE MOTS · A","Associe le mot","Произнеси слово и выбери картинку.")}<div class="task-layout"><div class="prompt-card"><div class="eyebrow">LE MOT</div><div class="prompt-word">${esc(o.fr)}</div></div><div class="choices">${opts.map(x=>`<button class="choice" data-answer="${x.id}" aria-label="Выбрать изображение">${objectSvg(x.id)}</button>`).join("")}</div></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="hintbox hidden" id="hintbox">Подсказка: попробуй вспомнить, в какой комнате можно увидеть этот предмет.</div></section>`;
}
function renderTranslation(task){
 const o=objectById(task.id);
 const distractors=shuffle(DATA.objects.filter(x=>x.id!==o.id&&x.category==="основная")).slice(0,3);
 const opts=shuffle([o,...distractors]);
 return `<section class="panel">${promptPanel("LA FABRIQUE DE MOTS · B","Trouve le mot en français","Прочитай перевод, произнеси французское слово и выбери вариант.")}<div class="task-layout"><div class="prompt-card"><div class="eyebrow">COMMENT DIT-ON EN FRANÇAIS ?</div><div class="prompt-translation">«${esc(o.translation)}»</div></div><div class="choices">${opts.map(x=>`<button class="choice" data-answer="${x.id}">${esc(x.fr)}</button>`).join("")}</div></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="hintbox hidden" id="hintbox">Подсказка: можно произнести начало слова вместе с преподавателем. Полная форма пока скрыта.</div></section>`;
}
function renderLetters(task){
 const o=objectById(task.id), word=o.noun;
 let chars=[...word];
 // Long words are split into letter tiles too; accents and punctuation remain real characters.
 const shuffled=shuffle(chars.map((ch,i)=>({ch,key:i})));
 return `<section class="panel">${promptPanel("LA FABRIQUE DE MOTS · C","Construis le mot",`Скажи слово «${esc(o.translation)}» по-французски, затем собери его из букв. Артикль пока не нужен.`)}<div class="prompt-card" style="min-height:150px"><div class="eyebrow">LE MOT À CONSTRUIRE</div><div class="prompt-translation">${esc(o.translation)}</div><p class="illustration-caption">Французское написание появится после попытки.</p></div><div class="slots" id="slots">${chars.map((ch,i)=>`<button class="slot" data-slot="${i}" aria-label="Позиция ${i+1}"></button>`).join("")}</div><div class="letter-bank" id="letterBank">${shuffled.map(t=>`<button class="word-letter" data-letter="${t.key}" data-char="${esc(t.ch)}">${esc(t.ch)}</button>`).join("")}</div><div class="letter-controls"><button class="softbtn" id="undoLetter">← Убрать букву</button><button class="softbtn" id="clearLetters">Очистить</button><button class="softbtn" id="showModel">Voir le modèle</button><button class="primary" id="checkLetters">Vérifier ✓</button></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="hintbox hidden" id="hintbox">Подсказка: обрати внимание на буквы с диакритическими знаками, если они есть. Можно открыть образец, а затем скрыть его и попробовать ещё раз.</div><div id="model" class="sentence-result hidden" style="margin-top:12px">${esc(word)}</div></section>`;
}
function renderArticle(task){
 const o=objectById(task.id);
 const examples=shuffle(DATA.objects.filter(x=>x.id!==o.id&&x.category==="основная")).slice(0,3);
 return `<section class="panel">${promptPanel("UN OU UNE ?","Regarde les mots","Произнеси их и обрати внимание на артикль.")}<div class="article-pairs">${[o,...examples].slice(0,4).map(x=>`<div class="article-example"><span class="article ${x.article==="un"?"article-un":"article-une"}">${esc(x.article)}</span>${esc(x.noun)}</div>`).join("")}</div><div class="article-question"><div class="eyebrow">À TOI DE CHOISIR</div><div class="noun">___ ${esc(o.noun)}</div><p class="illustration-caption">Какой артикль подходит к этому слову?</p><div class="article-buttons"><button class="choice" data-article="un">un</button><button class="choice" data-article="une">une</button></div></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="hintbox hidden" id="hintbox">Посмотри на примеры выше. Найди слово с таким же артиклем и попробуй ещё раз.</div></section>`;
}
function renderPhrase(task){
 const p=DATA.phrases.find(x=>x.id===task.id), o=objectById(p.object);
 const ruRooms={chambre:"В спальне",salon:"В гостиной",cuisine:"На кухне"};
 const ruObjects={lit:"кровать",fenetre:"окно",canape:"диван",table:"стол",chaise:"стул",fauteuil:"кресло"};
 const roomOptions=shuffle([...new Map(DATA.phrases.map(x=>[x.roomId,x.room])).entries()].slice(0,3).map(([id,fr])=>({id,text:`Dans ${fr}`,kind:"room",correct:id===p.roomId})));
 const objectIds=[...new Set(DATA.phrases.map(x=>x.object))];
 const objectOptions=shuffle(objectIds.map(id=>({id,text:objectById(id).fr,kind:"object",correct:id===p.object})).slice(0,6));
 const blocks=[...roomOptions,{id:"structure",text:"il y a",kind:"structure"},...objectOptions];
 const mixed=shuffle(blocks);
 const roomRu=ruRooms[p.roomId]||"В комнате";
 const objRu=ruObjects[p.object]||o.translation;
 const expected=`Dans ${p.room}, il y a ${o.fr}.`;
 return `<section class="panel">${promptPanel("LA FABRIQUE DE PHRASES","Fais une phrase","Прочитай перевод и собери французское предложение. Выбери нужную комнату, конструкцию и предмет.")}<div class="phrase-area"><div class="phrase-scene" style="display:block;text-align:center"><div class="eyebrow">EN RUSSE</div><div class="prompt-translation" style="font-size:clamp(23px,3vw,34px)">${roomRu} есть ${objRu}.</div></div><div><div class="eyebrow">CHOISIS LES BLOCS DANS L’ORDRE</div><div class="phrase-bank" id="phraseBank">${mixed.map((b,i)=>`<button class="tile ${b.kind}" data-bank="${b.id}" data-correct="${b.correct===true}">${esc(b.text)}</button>`).join("")}</div><div class="phrase-bank" id="phraseOrder" style="background:#fff;margin-top:10px;min-height:72px;border:2px dashed var(--line)"></div></div><div class="letter-controls"><button class="softbtn" id="undoPhrase">← Убрать блок</button><button class="softbtn" id="resetPhrase">Начать заново</button><button class="primary" id="checkPhrase">Vérifier ✓</button></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="hintbox hidden" id="hintbox">Подсказка: начни с «Dans…», затем выбери «il y a», а в конце — предмет с правильным артиклем.</div></div></section>`;
}
function renderChase(){
 return `<section class="panel">${promptPanel("BONUS · LA CHASSE AUX OBJETS","Trouve les objets !","Преподаватель называет предмет по-французски или по-русски. Ученица показывает, где он находится, а преподаватель нажимает на предмет.")}<div class="scene-wrap"><svg class="scene" viewBox="0 0 620 360" role="img" aria-label="Схематичная комната с кроватью, окном, столом и стулом">
 <rect x="12" y="12" width="596" height="336" rx="15" fill="#fff5df" stroke="#24334a" stroke-width="4"/><path d="M20 250H600" stroke="#24334a" stroke-width="4"/>
 <g class="scene-item" data-found="fenetre" tabindex="0" role="button" aria-label="Окно"><rect x="48" y="38" width="145" height="112" rx="5" fill="#a9c9df" stroke="#24334a" stroke-width="4"/><path d="M120 40V148M50 95H191" stroke="#24334a" stroke-width="4"/><path d="M58 50L92 40M138 148L183 110" stroke="#fffdf8" stroke-width="5"/></g>
 <g class="scene-item" data-found="lit" tabindex="0" role="button" aria-label="Кровать"><rect x="330" y="195" width="235" height="54" rx="10" fill="#a9c9df" stroke="#24334a" stroke-width="4"/><rect x="344" y="176" width="67" height="32" rx="8" fill="#fffdf8" stroke="#24334a" stroke-width="4"/><path d="M330 210V285M565 210V285M348 250V282M545 250V282" stroke="#24334a" stroke-width="4"/><path d="M420 205H552V238H420Z" fill="#f4a18e" stroke="#24334a" stroke-width="4"/></g>
 <g class="scene-item" data-found="table" tabindex="0" role="button" aria-label="Стол"><path d="M45 205H245V228H45Z" fill="#f5d778" stroke="#24334a" stroke-width="4"/><path d="M65 228V290M225 228V290" stroke="#24334a" stroke-width="4"/></g>
 <g class="scene-item" data-found="chaise" tabindex="0" role="button" aria-label="Стул"><rect x="250" y="180" width="56" height="64" rx="8" fill="#f4a18e" stroke="#24334a" stroke-width="4"/><rect x="242" y="232" width="72" height="17" rx="5" fill="#f5d778" stroke="#24334a" stroke-width="4"/><path d="M253 249L248 284M303 249L308 284" stroke="#24334a" stroke-width="4"/></g>
 <path d="M22 310Q95 304 166 310T310 310T454 310T598 310" fill="none" stroke="#d7cbb5" stroke-width="3"/>
 </svg></div><div class="chase-controls"><strong>À trouver :</strong><button class="softbtn" data-chase-target="lit">un lit</button><button class="softbtn" data-chase-target="fenetre">une fenêtre</button><button class="softbtn" data-chase-target="table">une table</button><button class="softbtn" data-chase-target="chaise">une chaise</button><button class="primary" id="foundBtn">Trouvé ! ✓</button></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="hintbox hidden" id="hintbox">Попроси ученицу описать место предмета по-русски, если пока трудно назвать его по-французски. На картинке четыре предмета.</div></section>`;
}
function bindTask(task){
 if(task.type==="roomChoice"){
  $$('[data-room-answer]',main).forEach(btn=>btn.addEventListener("click",()=>{
   if(btn.dataset.roomAnswer===task.id){btn.classList.add("correct");feedback("Oui, c’est ça ! Dis le nom de la pièce encore une fois.","good");}
   else{btn.classList.add("incorrect");feedback("Regardons encore une fois ! Essaie une autre réponse.","try");}
  }));
 }
 if(task.type==="match"||task.type==="translation"){
  $$("[data-answer]",main).forEach(btn=>btn.addEventListener("click",()=>{
   const ok=btn.dataset.answer===task.id;
   if(ok){btn.classList.add("correct");feedback("Oui, c’est ça ! Скажи слово ещё раз вслух.","good");}
   else{btn.classList.add("incorrect");feedback("Regardons encore une fois ! Попробуй выбрать другой вариант.","try");}
  }));
 }
 if(task.type==="letters"){
  state.letterSlots=Array([...objectById(task.id).noun].length).fill(null);
  const refresh=()=>{
   $$("#slots .slot").forEach((s,i)=>{s.textContent=state.letterSlots[i]?.ch||"";s.classList.toggle("filled",!!state.letterSlots[i]);});
   $$("#letterBank .word-letter").forEach(b=>b.classList.toggle("used",state.letterSlots.some(x=>x&&String(x.key)===b.dataset.letter)));
  };
  $$("#letterBank .word-letter").forEach(btn=>btn.addEventListener("click",()=>{
   const already=state.letterSlots.some(x=>x&&String(x.key)===btn.dataset.letter);if(already)return;
   const idx=state.letterSlots.findIndex(x=>x===null);if(idx<0)return;
   state.letterSlots[idx]={key:btn.dataset.letter,ch:btn.dataset.char};refresh();
  }));
  $("#undoLetter").addEventListener("click",()=>{for(let i=state.letterSlots.length-1;i>=0;i--){if(state.letterSlots[i]){state.letterSlots[i]=null;break;}}refresh();});
  $("#clearLetters").addEventListener("click",()=>{state.letterSlots.fill(null);refresh();$("#feedback").textContent="";});
  $("#showModel").addEventListener("click",()=>{$("#model").classList.toggle("hidden");$("#showModel").textContent=$("#model").classList.contains("hidden")?"Voir le modèle":"Cacher le modèle";});
  $("#checkLetters").addEventListener("click",()=>{
   const answer=state.letterSlots.map(x=>x?.ch||"").join("");
   const target=objectById(task.id).noun;
   if(answer===target)feedback("Bravo ! Le mot est bien construit. Prononce-le une fois encore.","good");
   else feedback("Essayons ensemble ! Compare les lettres, puis corrige celles qui sont à la mauvaise place.","try");
  });
  $$("#slots .slot").forEach((slot,i)=>slot.addEventListener("click",()=>{state.letterSlots[i]=null;refresh();}));
 }
 if(task.type==="article"){
  $$("[data-article]",main).forEach(btn=>btn.addEventListener("click",()=>{
   const o=objectById(task.id);
   if(btn.dataset.article===o.article){btn.classList.add("correct");feedback(`Oui : ${o.fr}. Dis le groupe de mots en entier !`,"good");}
   else{btn.classList.add("incorrect");feedback("Regardons les exemples au-dessus. Quel mot a le même article ?","try");}
  }));
 }
 if(task.type==="phrase"){
  const p=DATA.phrases.find(x=>x.id===task.id), o=objectById(p.object);
  const roomRu={chambre:"спальня",salon:"гостиная",cuisine:"кухня"};
  const objRu={lit:"кровать",fenetre:"окно",canape:"диван",table:"стол",chaise:"стул",fauteuil:"кресло"};
  const roomOptions=[...new Map(DATA.phrases.map(x=>[x.roomId,x.room])).entries()].slice(0,3).map(([id,fr])=>({id:"room:"+id,text:`Dans ${fr}`,kind:"room",correct:id===p.roomId}));
  const objectOptions=[...new Set(DATA.phrases.map(x=>x.object))].map(id=>({id:"object:"+id,text:objectById(id).fr,kind:"object",correct:id===p.object}));
  const all=[...roomOptions,{id:"structure",text:"il y a",kind:"structure",correct:true},...objectOptions];
  state.phraseBank=shuffle(all);state.phraseOrder=[];
  const draw=()=>{
   $("#phraseBank").innerHTML=state.phraseBank.map(b=>`<button class="tile ${b.kind}" data-bank="${b.id}">${esc(b.text)}</button>`).join("");
   $("#phraseOrder").innerHTML=state.phraseOrder.map((b,i)=>`<button class="tile ${b.kind}" data-ordered="${i}">${esc(b.text)} ×</button>`).join("");
   $$("#phraseBank [data-bank]").forEach(btn=>btn.addEventListener("click",()=>{const b=state.phraseBank.find(x=>x.id===btn.dataset.bank);if(b){state.phraseBank=state.phraseBank.filter(x=>x.id!==b.id);state.phraseOrder.push(b);draw();}}));
   $$("#phraseOrder [data-ordered]").forEach(btn=>btn.addEventListener("click",()=>{const b=state.phraseOrder.splice(Number(btn.dataset.ordered),1)[0];state.phraseBank.push(b);draw();}));
  };
  draw();
  $("#undoPhrase").addEventListener("click",()=>{const b=state.phraseOrder.pop();if(b)state.phraseBank.push(b);draw();});
  $("#resetPhrase").addEventListener("click",()=>{state.phraseOrder=[];state.phraseBank=shuffle(all);draw();$("#feedback").textContent="";});
  $("#checkPhrase").addEventListener("click",()=>{
   const got=state.phraseOrder;
   const valid=got.length===3&&got[0].id==="room:"+p.roomId&&got[1].id==="structure"&&got[2].id==="object:"+p.object;
   if(valid)feedback(`Parfait ! ${p.sentence}`,"good");
   else feedback("Essayons encore ! Choisis la bonne pièce, puis « il y a », puis le bon objet avec son article.","try");
  });
 }
 if(task.type==="chase"){
  let active="lit";
  $$("[data-chase-target]",main).forEach(b=>b.addEventListener("click",()=>{active=b.dataset.chaseTarget;$$("[data-chase-target]",main).forEach(x=>x.classList.toggle("selected",x===b));feedback(`À trouver : ${b.textContent}. L’élève peut le montrer à l’écran.`,"");}));
  const mark=(id)=>{if(!state.chaseFound.includes(id))state.chaseFound.push(id);const el=$(`[data-found="${id}"]`,main);if(el){el.style.opacity=".72";el.style.filter="drop-shadow(0 0 3px #3e7654)";}feedback("Trouvé ! Disons le mot ensemble.","good");};
  $$(".scene-item",main).forEach(el=>{el.addEventListener("click",()=>{mark(el.dataset.found);});el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();mark(el.dataset.found);}});});
  $("#foundBtn").addEventListener("click",()=>mark(active));
 }
}
function feedback(text,type){const el=$("#feedback");if(!el)return;el.textContent=text;el.className="feedback"+(type?" "+type:"");}
function showHint(){
 const task=current();if(!task)return;
 const box=$("#hintbox");if(!box)return;
 box.classList.toggle("hidden");
 $("#hintBtn").textContent=box.classList.contains("hidden")?"💡 Подсказка":"Скрыть подсказку";
 if(task.type==="letters"&&!box.classList.contains("hidden"))feedback("Можно открыть образец кнопкой «Voir le modèle», затем скрыть его и повторить сборку.","");
}
function goNext(){
 if(state.screen==="home")return;
 if(state.screen==="end"){home();return;}
 if(state.index<state.taskList.length-1){state.history.push(state.index);state.index++;render();}
 else{state.screen="end";endScreen();}
}
function goBack(){
 if(state.screen==="game"&&state.index>0){state.index--;render();}
 else if(state.screen==="game"){home();}
}
function skip(){if(state.index<state.taskList.length-1){state.index++;render();}else{state.screen="end";endScreen();}}
function restart(){if(state.mode)startMode(state.mode);else home();}
function endScreen(){
 setProgress();
 const name=modeNames[state.mode]||"L’atelier";
 main.innerHTML=`<section class="panel end-panel"><div class="end-star">✦</div><div class="eyebrow">ATELIER TERMINÉ</div><h2>Bravo !</h2><p class="lead" style="margin-left:auto;margin-right:auto">Tu as exploré <strong>${esc(name)}</strong>. On peut reprendre un mot, refaire un essai ou choisir un autre atelier.</p><div class="end-actions"><button class="primary" id="repeatMode">Refaire cet atelier ↻</button><button class="softbtn" id="returnHome">Choisir un atelier</button><button class="softbtn" id="goChase">La chasse aux objets</button></div></section>`;
 $("#repeatMode").addEventListener("click",()=>startMode(state.mode));
 $("#returnHome").addEventListener("click",home);
 $("#goChase").addEventListener("click",()=>startMode("chase"));
}
$("#homeBtn").addEventListener("click",home);
$("#restartBtn").addEventListener("click",restart);
$("#backBtn").addEventListener("click",goBack);
$("#skipBtn").addEventListener("click",skip);
$("#hintBtn").addEventListener("click",showHint);
$("#nextBtn").addEventListener("click",goNext);
document.addEventListener("keydown",e=>{
 if(e.key==="ArrowRight"&&!e.target.matches("button,input,textarea"))goNext();
 if(e.key==="ArrowLeft"&&!e.target.matches("button,input,textarea"))goBack();
});
// Ouvre directement un atelier si l’URL contient ?game=mots, ?game=articles, ?game=phrases ou ?game=chasse.
const requestedGame = new URLSearchParams(window.location.search).get("game");
const gameAliases = { mots: "words", words: "words", articles: "articles", phrases: "phrases", chasse: "chase", chase: "chase" };
if (requestedGame && gameAliases[requestedGame]) startMode(gameAliases[requestedGame]);
else home();
</script>
</body>
</html>
